services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery_auth
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  auth-service:
    build: ./auth-service
    environment: &pg_env
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: food_delivery_auth
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: fooddeliveryjwt
    depends_on: [postgres]
    ports: ["5001:5001"]

  user-service:
    build: ./user-service
    environment: *pg_env
    depends_on: [postgres]
    ports: ["5002:5002"]

  product-service:
    build: ./product-service
    environment:
      PORT: 5003
      MONGO_URI: mongodb://mongo:27017/product-service
    depends_on: [mongo]
    ports: ["5003:5003"]

  restaurant-service:
    build: ./restaurant-service
    environment:
      PORT: 5004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: food_delivery_auth
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKER: kafka:9092
      KAFKA_CONSUMER_TOPIC: restaurant.commands
    depends_on: [postgres, kafka]
    ports: ["5004:5004"]

  order-service:
    build: ./order-service
    environment:
      PORT: 5005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: food_delivery_auth
      DB_USER: postgres
      DB_PASSWORD: postgres
      PRODUCT_SERVICE_URL: http://product-service:5003/api
      RESTAURANT_SERVICE_URL: http://restaurant-service:5004/api
      KAFKA_BROKER: kafka:9092
    depends_on: [postgres, product-service, restaurant-service, kafka]
    ports: ["5005:5005"]

  notification-service:
    build: ./notification-service
    environment:
      PORT: 5007
      MONGODB_URI: mongodb://mongo:27017/notification-db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092
    depends_on: [mongo, redis, kafka]
    ports: ["5007:5007"]

  gateway-service:
    build: ./gateway-service
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      USER_SERVICE_URL: http://user-service:5002
      RESTAURANT_SERVICE_URL: http://restaurant-service:5004
      PRODUCT_SERVICE_URL: http://product-service:5003
      ORDER_SERVICE_URL: http://order-service:5005
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
      KAFKA_BROKER: kafka:9092
    depends_on: [auth-service, user-service, product-service, restaurant-service, order-service, notification-service]
    ports: ["5000:5000"]

volumes:
  postgres_data:
  mongo_data:
